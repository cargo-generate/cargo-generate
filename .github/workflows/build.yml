## references:
# cache: https://github.com/actions/cache/blob/main/examples.md#rust---cargo
# audit: https://github.com/actions-rs/audit-check
# "needs": https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idneeds

name: Build
on:
  push:
    branches: ["*"]
    paths-ignore:
      - "**/docs/**"
      - "**.md"
  pull_request:
    branches: [main]
  workflow_call:
  merge_group:
  repository_dispatch:
    types: [create-pull-request]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  # sccache is opt-out on Windows: after the gix migration, rustc's linker
  # command line (MSVC toolchain paths + gix's transitive `-L native=…`
  # entries) exceeds Windows' 32K `CreateProcess` limit when wrapped by
  # sccache, failing with `os error 206`. Each Windows-inclusive job below
  # clears RUSTC_WRAPPER and skips the sccache-action install.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@master
        with:
          config: ./typos.toml

  check:
    name: check
    strategy:
      fail-fast: false
      matrix:
        version: ["macos-latest", "ubuntu-latest", "windows-latest"]
        features: ["", "--no-default-features"]
    runs-on: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7
      - name: setup | rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          default: true
          profile: minimal
          components: clippy, rustfmt
      - name: disable sccache on windows (command-line length limit)
        if: matrix.version == 'windows-latest'
        shell: bash
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
      - if: matrix.version != 'windows-latest'
        uses: mozilla-actions/sccache-action@v0.0.11
      - run: cargo check ${{ matrix.features }}

      # The example crates are not workspace members, so nothing else
      # builds them. They each pin their own `default-features`, which
      # is the point of them — check they still hold.
      - name: check examples
        if: matrix.features == ''
        shell: bash
        run: |
          for ex in examples/*/; do
            echo "::group::$ex"
            cargo check --manifest-path "$ex/Cargo.toml" --locked
            echo "::endgroup::"
          done

  lint:
    name: lint
    strategy:
      fail-fast: false
      matrix:
        version: ["macos-latest", "ubuntu-latest", "windows-latest"]
        cargo-cmd:
          - fmt --all -- --check
          - clippy --all-targets --all-features -- -D warnings
          - clippy --all-targets --no-default-features -- -D warnings
    runs-on: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7
      - name: setup | rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          default: true
          profile: minimal
          components: clippy, rustfmt
      - name: disable sccache on windows (command-line length limit)
        if: matrix.version == 'windows-latest'
        shell: bash
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
      - if: matrix.version != 'windows-latest'
        uses: mozilla-actions/sccache-action@v0.0.11
      - run: cargo ${{ matrix['cargo-cmd'] }}

  tests:
    name: test
    strategy:
      fail-fast: false
      matrix:
        version: ["macos-latest", "ubuntu-latest", "windows-latest"]
        rust: [nightly, stable]
    runs-on: ${{ matrix.version }}
    continue-on-error: ${{ matrix.rust == 'nightly' }}
    steps:
      - uses: actions/checkout@v7
      - name: setup | rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          default: true
          profile: minimal
      - name: disable sccache on windows (command-line length limit)
        if: matrix.version == 'windows-latest'
        shell: bash
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
      - if: matrix.version != 'windows-latest'
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: git test setup preparation
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
      - name: install ssh key
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          mkdir -p $HOME/.ssh
          echo "${{ secrets.CARGO_GENERATE_E2E_SSH_PRIVATE_KEY }}" > $HOME/.ssh/id_rsa
          echo "${{ secrets.CARGO_GENERATE_E2E_SSH_PUBLIC_KEY }}" > $HOME/.ssh/id_rsa.pub
          chmod 600 $HOME/.ssh/id_rsa $HOME/.ssh/id_rsa.pub
          ssh-keyscan github.com >> $HOME/.ssh/known_hosts
          chmod 644 $HOME/.ssh/known_hosts

      - name: start ssh-agent on windows
        if: ${{ github.event_name != 'pull_request' && matrix.version == 'windows-latest' }}
        run: |
          Get-Service ssh-agent | Set-Service -StartupType Manual
          Start-Service ssh-agent
          Get-Service ssh-agent
          ssh-add $ENV:UserProfile\.ssh\id_rsa

      - name: start ssh-agent
        if: ${{ github.event_name != 'pull_request' && matrix.version != 'windows-latest' }}
        shell: bash
        run: |
          eval `ssh-agent`
          echo SSH_AUTH_SOCK="$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo SSH_AGENT_PID="$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add $HOME/.ssh/id_rsa
          ssh-add -l

      - name: cargo test (with e2e tests with ssh key)
        if: ${{ github.event_name != 'pull_request' && matrix.version != 'windows-latest' }}
        shell: bash
        run: cargo test --verbose --all --locked
        env:
          RUST_LOG: debug
          RUST_BACKTRACE: full
          CARGO_GENERATE_E2E_SSH_PRIVATE_KEY: ~/.ssh/id_rsa
          RUSTFLAGS: "--cfg e2e_tests_with_ssh_key"

      - name: cargo test (no e2e tests with ssh key)
        if: ${{ github.event_name == 'pull_request' || matrix.version == 'windows-latest' }}
        shell: bash
        run: cargo test --verbose --all --locked
        env:
          RUST_LOG: debug
          RUST_BACKTRACE: full

      - name: cargo test (no default features)
        # Stable only — nightly is continue-on-error, so it would add noise
        # without gating anything. All three platforms, though: the helpers
        # that stay compiled without the feature are the fs ones, and they
        # are exactly where the platforms differ.
        if: ${{ matrix.rust == 'stable' }}
        shell: bash
        run: cargo test --verbose --all --locked --no-default-features
        env:
          RUST_LOG: debug
          RUST_BACKTRACE: full

      - name: smoke tests
        shell: bash
        run: |
          cargo run -- --version
          cargo run -- --help

  coverage:
    name: code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: setup | rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          default: true
          profile: minimal
          components: clippy, rustfmt
      - name: git test setup preparation
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
      - name: start ssh-agent
        shell: bash
        run: |
          eval `ssh-agent`
          echo SSH_AUTH_SOCK="$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo SSH_AGENT_PID="$SSH_AGENT_PID" >> "$GITHUB_ENV"
      - name: install ssh key
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          mkdir -p $HOME/.ssh
          echo "${{ secrets.CARGO_GENERATE_E2E_SSH_PRIVATE_KEY }}" > $HOME/.ssh/id_rsa
          chmod 600 $HOME/.ssh/id_rsa
          ssh-keyscan github.com >> $HOME/.ssh/known_hosts
          chmod 644 $HOME/.ssh/known_hosts
          ssh-add $HOME/.ssh/id_rsa
          ssh-add -l
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate code coverage
        if: ${{ github.event_name != 'pull_request' }}
        run: cargo llvm-cov --all-features --workspace  --codecov --output-path codecov.json
        env:
          CARGO_GENERATE_E2E_SSH_PRIVATE_KEY: ~/.ssh/id_rsa
          RUSTFLAGS: "--cfg e2e_tests_with_ssh_key"
      - name: Generate code coverage
        if: ${{ github.event_name == 'pull_request' }}
        run: cargo llvm-cov --all-features --workspace  --codecov --output-path codecov.json
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6.0.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: codecov.json
          verbose: true
          fail_ci_if_error: false

  audit:
    name: security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: setup | rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          default: true
          profile: minimal
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: audit
        uses: actions-rs/audit-check@v1
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-dry-run:
    name: publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: setup | rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          default: true
          profile: minimal
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: cargo publish --dry-run

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: setup | rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          default: true
          profile: minimal
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features
