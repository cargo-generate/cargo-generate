[package]
name = "scaffold-from-blueprint"
version = "0.1.0"
edition = "2021"
publish = false
description = """
Shows cargo-generate used as a template engine with the `git` feature turned
off: the blueprint is compiled into the binary, so nothing needs cloning.
"""

[dependencies]
# No git support: this tool only ever generates from its own bundled
# blueprint, so the gix/reqwest/rustls tree is dead weight.
# `version` alongside `path` so this line reads the way a real
# consumer would write it, and so CI resolves the same requirement the
# blueprint below asks for.
cargo-generate = { path = "../..", version = "0.25", default-features = false }

# The blueprint is baked into the binary and unpacked at runtime, so the
# tool works wherever it is installed.
include_dir = "0.7"
tempfile = "3"
